[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-v3"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.2.0",
    "numpy>=2.2.6",
    "optuna>=4.5.0",
    "torchrl==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blackjack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
